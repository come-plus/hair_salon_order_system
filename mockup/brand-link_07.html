<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<title>取り扱いブランド</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 英数字はにくまる、それ以外はニコモジ＋ */
  @font-face {
    font-family: "BrandDisplay";
    src: url("./fonts/07にくまるフォント.otf") format("opentype");
    unicode-range: U+0030-0039, U+0041-005A, U+0061-007A;
    font-display: swap;
  }
  @font-face {
    font-family: "BrandDisplay";
    src: url("./fonts/nicomoji-plus_v2-5.ttf") format("truetype");
    unicode-range: U+0000-002F, U+003A-0040, U+005B-0060, U+007B-10FFFF;
    font-display: swap;
  }
  /* ブランド名全体に使う、にくまる */
  @font-face {
    font-family: "Nikumaru";
    src: url("./fonts/07にくまるフォント.otf") format("opentype");
    font-display: swap;
  }

  /* コスギまるはGoogle Fontsで読み込み済み */

  body {
    font-family: "Kosugi Maru", sans-serif;
    background: #faf7f2;
    color: #7b5d3e;
    padding: 24px 16px 60px;
  }
  h1 {
    font-family: "BrandDisplay", "NicomojiPlus", sans-serif;
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }
  .subtitle {
    text-align: center;
    font-size: 20px;
    color: #484037;
    margin-bottom: 12px;
    line-height: 1.7;
  }
  .lead-text {
    max-width: 420px;
    margin: 0 auto 28px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    color: #332222;
    line-height: 1.8;
  }
  .brand-list {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .brand-card {
    display: block;
    background: #fff;
    border: 1px solid #e8e0d5;
    border-radius: 14px;
    padding: 22px;
    text-decoration: none;
    color: #201515;
    text-align: center;
    box-shadow: 0 2px 8px rgba(58, 47, 40, 0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .brand-card:active {
    transform: scale(0.98);
    box-shadow: 0 1px 4px rgba(58, 47, 40, 0.08);
  }
  .brand-card-wrap {
    background: #fff;
    border: 1px solid #e8e0d5;
    border-radius: 14px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(58, 47, 40, 0.06);
  }
  .brand-card-wrap > .brand-card {
    display: block;
    background: none;
    border: none;
    padding: 0;
    box-shadow: none;
  }
  .brand-logo {
    max-width: 280px;
    max-height: 100px;
    width: auto;
    height: auto;
    margin-bottom: 10px;
  }
  .brand-name {
    font-family: "Nikumaru", sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 20px;
  }
  .brand-desc {
    font-size: 18px;
    color: #100d09;
    margin-top: 6px;
    line-height: 1.6;
  }
  .arrow, .registration-button {
    display: inline-block;
    background: #fff;
    border: 1.5px solid #222;
    border-radius: 13px;
    color: #050505;
    text-decoration: none;
    padding: 11px 20px;
    font: 700 24px/1.35 "Kosugi Maru", sans-serif;
    box-shadow: -7px 8px 0 #191919;
    margin: 8px 0 12px 7px;
  }
  .registration-button {
    border-radius: 100px;
    margin-bottom: 32px;
  }
  .brand-card-wrap > .arrow {
    margin-top: 10px;
  }
  .davines-note {
    font-family: "Kosugi Maru", sans-serif;
    display: block;
    border: 3px solid #050505;
    border-radius: 100px;
    padding: 15px 8px 10px;
    color: #111;
    text-decoration: none;
    font-size: clamp(17px, 4.7vw, 18px);
    font-weight: 700;
    line-height: 1.5;
    margin: 20px 0 20px;
  }
  .bhappy-notice {
    font-family: "Kosugi Maru", sans-serif;
    display: block;
    border: 3px solid #050505;
    border-radius: 100px;
    padding: 15px 8px 10px;
    color: #111;
    text-decoration: none;
    font-size: clamp(17px, 4.7vw, 18px);
    font-weight: 700;
    line-height: 1.5;
    margin: 20px 0 20px;
  }
  .bhappy-notice strong {
    display: block;
    font-size: 24px;
    background: linear-gradient(90deg, #8c40ff, #d052b5, #ff9c45);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  /* B happy公式LINEへのリンクのみLINEカラーに変更 */
  .line-button {
    background: #06C755;
    color: #fff;
    border-color: #06C755;
  }
</style>
</head>
<body>

  <h1>取り扱いブランド</h1>
  
  <p class="lead-text">
    在庫の有無　お取り寄せに関しては<br>直接Nissyまでお問い合わせ下さい
  </p>

  <div class="brand-list">
    <a class="brand-card" href="https://alpsion.com/" target="_blank" rel="noopener">
      <img class="brand-logo" src="./images/alpsion_logo.jpg" alt="ALPSION">
      <div class="brand-name">アルピジョン</div>
      <div class="brand-desc">
        アルピジョンはサロン専売商品です<br>
        ネット通販サイトなどの商品は<br>
        品質の保証ができかねます
      </div>
      <span class="arrow">商品を見る →</span>
    </a>

    <div class="brand-card-wrap">
      <div class="brand-card">
        <img class="brand-logo" src="./images/davines_logo.png" alt="davines">
        <div class="brand-name">ダヴィネス</div>
        <div class="brand-desc">
          ダヴィネスの商品は<br>
          美容室専売商品と<br>
          実店舗のみの取り扱いのものがあります
        </div>
      </div>
      <a class="davines-note" href="./davines-guide.html">
        公式サイトで購入の際の入力について
      </a>
      <a class="arrow" href="https://davines.co.jp/" target="_blank" rel="noopener">商品を見る →</a>
    </div>

    <div class="brand-card-wrap">
      <div class="brand-card">
        <img class="brand-logo" src="./images/m-moulin_logo.png" alt="MOULIN ET MOULIN">
        <div class="brand-name">ムーランエムーラン</div>
        <div class="brand-desc">
          販売代行サービス開始<br>
          会員登録後<br>
          ご自宅でシャンプーを受け取れます
        </div>
      </div>
      <a class="registration-button" href="https://ec.m-moulin.jp/765596" target="_blank" rel="noopener">会員登録はこちら</a>
      <a class="arrow" href="https://m-moulin.jp/" target="_blank" rel="noopener">商品を見る →</a>
    </div>

    <div class="brand-card-wrap">
      <div class="brand-card">
        <img class="brand-logo" src="./images/bhappy_logo_black.png" alt="B happy">
        <div class="brand-name">ビーハッピー</div>
        <div class="brand-desc">
          リファ公式サイト<br>
          会員登録には紹介コードが必要です
        </div>
      </div>
      <a class="bhappy-notice" href="./bhappy-guide.html">
        <strong>紹介コードについて</strong>
      </a>
      <a class="arrow line-button" href="https://liff.line.me/1645278921-kWRPP32q/?accountId=734rgpys" target="_blank" rel="noopener">公式LINEを見る →</a>
    </div>
  </div>

</body>
</html>
